<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Origami</title>
    <script>
      // Pre-paint theme bootstrap: the CSS has no media-query fallback, so
      // resolve "system" before first paint to avoid a light flash on dark OS.
      (function () {
        try {
          var pref = "system";
          var saved = JSON.parse(localStorage.getItem("origami-preferences") || "{}");
          if (saved.theme === "light" || saved.theme === "dark" || saved.theme === "ember") {
            pref = saved.theme;
          }
          if (pref === "system") {
            pref = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = pref;
          // Apply the saved font scale before first paint as well, so a
          // non-default preference does not flash the 100% chrome.
          var scale = saved.fontScale;
          if (typeof scale === "number" && isFinite(scale)) {
            scale = Math.min(150, Math.max(85, Math.round(scale))) / 100;
            document.documentElement.style.setProperty("--ui-font-scale", String(scale));
          }
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
