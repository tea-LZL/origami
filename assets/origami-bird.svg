<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Origami bird application logo</title>
  <desc id="desc">A clean white origami bird on a blue rounded-square background.</desc>

  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="456" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B8FF3"/>
      <stop offset="1" stop-color="#2676E8"/>
    </linearGradient>

    <linearGradient id="paperA" x1="66" y1="80" x2="365" y2="313" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FE"/>
    </linearGradient>

    <linearGradient id="paperB" x1="130" y1="440" x2="418" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1559B8" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="url(#bg)"/>

  <g filter="url(#softShadow)" stroke="#2D7DE8" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Upper wing -->
    <polygon points="58,67 233,116 194,262" fill="url(#paperA)"/>

    <!-- Main body / folded wing -->
    <polygon points="233,116 365,313 194,262" fill="#FBFDFF"/>

    <!-- Lower outer wing -->
    <polygon points="194,262 112,456 229,390" fill="url(#paperB)"/>

    <!-- Lower inner wing -->
    <polygon points="194,262 229,390 365,313" fill="#F8FBFF"/>

    <!-- Neck -->
    <polygon points="306,215 367,161 418,162 365,313" fill="url(#paperA)"/>

    <!-- Head / beak fold -->
    <polygon points="418,162 409,201 464,201" fill="#FFFFFF"/>
  </g>
</svg>
