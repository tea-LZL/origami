# cargo-deny policy for Origami.
# The app declares MIT/Apache-2.0; every accepted license below is either
# that pair, a permissive variant used by the dependency tree, or a Unicode
# license required by `unicode-ident`. Adjust only with a comment saying why.

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # Root certificate sets (webpki-roots / webpki-root-certs) ship under a
    # permissive data license; Mozilla-derived trust store data, not code.
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/pimalaya/io-imap"]
