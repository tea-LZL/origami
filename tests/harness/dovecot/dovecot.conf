protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/mail/%u

passdb {
  driver = static
  args = password=origami
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/mail/%u
}

log_path = /dev/stderr
info_log_path = /dev/stderr
