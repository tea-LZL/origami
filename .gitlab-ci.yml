stages:
  - verify
  - package
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

.arch:
  image: archlinux:latest
  before_script:
    - pacman -Syu --noconfirm --needed
        base-devel
        rust
        nodejs
        npm
        git
        curl
        file
        openssl
        webkit2gtk-4.1
        gtk3
        libsoup3
        libsecret
        libayatana-appindicator
        dbus
        xdg-utils
        desktop-file-utils
  cache:
    key:
      files:
        - Cargo.lock
        - ui/package-lock.json
    paths:
      - .cargo/registry/
      - .cargo/git/
      - .npm/
      - target/

rust:
  extends: .arch
  stage: verify
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo check --workspace --locked
    - cargo test --workspace --locked

ui:
  extends: .arch
  stage: verify
  script:
    - npm ci --prefix ui
    - npm audit --prefix ui --audit-level=moderate
    - npm test --prefix ui -- --run
    - npm run check --prefix ui
    - npm run build --prefix ui

package_arch:
  extends: .arch
  stage: package
  needs:
    - job: rust
    - job: ui
  script:
    - |
      source packaging/arch/PKGBUILD
      cargo_version="$(awk -F'"' '/^[[:space:]]*version = "/ { print $2; exit }' Cargo.toml)"
      tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('crates/origami-app/tauri.conf.json', 'utf8')).version")"
      ui_version="$(node -p "JSON.parse(require('fs').readFileSync('ui/package.json', 'utf8')).version")"
      test "$pkgver" = "$cargo_version"
      test "$pkgver" = "$tauri_version"
      test "$pkgver" = "$ui_version"
    - useradd --create-home --shell /bin/bash builder
    - chown -R builder:builder "$CI_PROJECT_DIR"
    - runuser -u builder -- env
        CI_PROJECT_DIR="$CI_PROJECT_DIR"
        CARGO_HOME="$CARGO_HOME"
        NPM_CONFIG_CACHE="$NPM_CONFIG_CACHE"
        HOME=/home/builder
        bash -c 'cd "$CI_PROJECT_DIR/packaging/arch" && makepkg --cleanbuild --force --noconfirm'
    - package_file="$(find packaging/arch -maxdepth 1 -type f -name 'origami-*.pkg.tar.zst' -print -quit)"
    - test -n "$package_file"
    - package_dir="$(dirname "$package_file")"
    - package_name="$(basename "$package_file")"
    - (cd "$package_dir" && sha256sum "$package_name" > "$package_name.sha256")
    - rm -rf package-check
    - mkdir package-check
    - tar -xf "$package_file" -C package-check
    - test -x package-check/usr/bin/origami
    - desktop-file-validate package-check/usr/share/applications/origami.desktop
    - pacman -Qp "$package_file"
    - pacman -U --noconfirm "$package_file"
    - pacman -Ql origami
    - tar -tf "$package_file" | sort
  artifacts:
    name: "origami-$CI_COMMIT_REF_SLUG"
    paths:
      - packaging/arch/*.pkg.tar.zst
      - packaging/arch/*.pkg.tar.zst.sha256
    expire_in: 30 days

publish_arch:
  extends: .arch
  stage: publish
  needs:
    - job: package_arch
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - source packaging/arch/PKGBUILD
    - test "${CI_COMMIT_TAG#v}" = "$pkgver"
    - package_file="$(find packaging/arch -maxdepth 1 -type f -name 'origami-*.pkg.tar.zst' -print -quit)"
    - test -n "$package_file"
    - |
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/origami/${CI_COMMIT_TAG}"
      for file in "$package_file" "$package_file.sha256"; do
        curl --fail --location --request PUT \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "$package_url/$(basename "$file")"
      done
